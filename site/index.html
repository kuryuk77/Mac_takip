<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maç Takip</title>
  <meta name="description" content="UEFA ülkelerinin liglerini tek yerden izle: puan durumu, fikstür, hafta hafta gol istatistikleri, oyuncu ve takım istatistikleri.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Cpath d='M16 8l6 4.5-2.3 7h-7.4L10 12.5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><path d="M16 8l6 4.5-2.3 7h-7.4L10 12.5z"/></svg>
        <span>Maç Takip</span>
      </a>
      <nav class="mainnav">
        <a href="#/" data-nav="home">Ligler</a>
        <a href="#/karsilastir" data-nav="compare">Karşılaştır</a>
      </nav>
      <div class="search">
        <input id="search" type="search" placeholder="Takım veya oyuncu ara…" autocomplete="off" aria-label="Takım veya oyuncu ara">
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Temayı değiştir" title="Açık / koyu tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>
  <main id="app" class="container" tabindex="-1">
    <p class="muted">Yükleniyor…</p>
  </main>
  <footer class="footer container">
    <span>Veri: <a href="https://www.football-data.org" rel="noopener">football-data.org</a></span>
    <span id="updated"></span>
  </footer>
  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
