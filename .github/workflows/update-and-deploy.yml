name: Veriyi güncelle ve yayınla

on:
  schedule:
    # Her gün 05:23 ve 22:47 (UTC) — maçlardan sonra ve sabah
    - cron: '23 5 * * *'
    - cron: '47 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bir lig o anda alınamazsa önceki verisi korunur.
      - name: Önceki veriyi geri yükle
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Veriyi çek
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-data.mjs

      - name: Veriyi önbelleğe kaydet
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: football-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
